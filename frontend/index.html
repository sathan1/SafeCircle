<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SafeCircle Universal Emergency Error Catcher
      window.addEventListener('error', function (e) {
        console.error('[SafeCircle Startup Error]', e);
        var root = document.getElementById('root');
        if (root && (!root.firstElementChild || root.children.length === 0)) {
          root.innerHTML = '<div style="min-height:100vh;background:#fcf8f8;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;color:#1c1917;">' +
            '<div style="max-width:420px;width:100%;background:#ffffff;padding:28px;border-radius:24px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);border:1px solid #e7e5e4;text-align:center;">' +
            '<div style="width:52px;height:52px;border-radius:16px;background:#fff1f2;color:#e11d48;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px auto;border:1px solid #fecdd3;">🛡️</div>' +
            '<h2 style="font-size:18px;font-weight:900;margin:0 0 8px 0;color:#1c1917;">SafeCircle Notice</h2>' +
            '<p style="font-size:12px;color:#78716c;margin:0 0 16px 0;line-height:1.5;">' + (e.message || 'The application is ready. Click below to enter.') + '</p>' +
            '<div style="display:flex;gap:8px;">' +
            '<button onclick="localStorage.clear();window.location.href=\'/login\';" style="flex:1;padding:10px 14px;background:#e11d48;color:#fff;font-weight:700;border:none;border-radius:12px;font-size:12px;cursor:pointer;">Go to Login</button>' +
            '<button onclick="window.location.href=\'/demo\';" style="flex:1;padding:10px 14px;background:#f5f5f4;color:#292524;font-weight:700;border:1px solid #d6d3d1;border-radius:12px;font-size:12px;cursor:pointer;">Demo View</button>' +
            '</div></div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
